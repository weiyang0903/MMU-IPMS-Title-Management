<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>FYP 项目搜索</title>
  <style>
    :root {
      color-scheme: only light;
      --bg: #f7f8f3;
      --card: #fff;
      --tx: #273c35;
      --mu: #778078;
      --bd: #e3e7de;
      --ac: #2d6854;
      --acs: #edf4e9;
      --ok: #357458;
      --oks: #edf5eb;
      --no: #ad6957;
      --nos: #fcf0e9;
      --hl: #f6e5a8;
      --st: #c99743;
      --shadow: 0 8px 32px #304a3610;
    }

    * {
      box-sizing: border-box
    }

    [hidden] {
      display: none !important
    }

    html {
      scroll-behavior: smooth;
      scrollbar-gutter: stable
    }

    body {
      margin: 0;
      color: var(--tx);
      background: var(--bg);
      font: 14px/1.65 "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased
    }

    button,
    input,
    select {
      font: inherit
    }

    button,
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 40px;
      padding: 9px 15px;
      border: 1px solid var(--bd);
      border-radius: 9px;
      background: #fff;
      color: var(--tx);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background .18s, border-color .18s, box-shadow .18s, transform .18s
    }

    button:hover,
    .btn:hover {
      background: #f4f7ef;
      border-color: #adc2a8
    }

    button:active,
    .btn:active {
      transform: translateY(1px)
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    .card:focus-visible {
      outline: 3px solid #97b999;
      outline-offset: 3px
    }

    input,
    select {
      color: var(--tx);
      accent-color: var(--ac)
    }

    input::placeholder {
      color: #92998f;
      opacity: 1
    }

    .icon {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none
    }

    .pri {
      color: #fff;
      background: var(--ac);
      border-color: var(--ac);
      box-shadow: 0 3px 8px #2d685418
    }

    .pri:hover {
      color: #fff;
      background: #245b48;
      border-color: #245b48;
      box-shadow: 0 5px 14px #2d685425
    }

    #file-state {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .search-band {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 62px;
      padding: 0 20px;
      background: #fff;
      border: 1px solid var(--bd);
      border-radius: 12px;
      box-shadow: 0 3px 12px #304a3503
    }

    .search-band>.icon {
      color: #5f7a61;
      width: 21px;
      height: 21px
    }

    #q {
      min-width: 0;
      flex: 1;
      width: 100%;
      padding: 17px 0;
      font-size: 13px;
      border: 0;
      outline: none;
      background: transparent
    }

    #q:disabled {
      cursor: not-allowed;
      opacity: .7
    }

    .search-band:focus-within {
      border-color: #9db591;
      box-shadow: 0 0 0 3px #dfe9d470
    }

    kbd {
      display: inline-grid;
      place-items: center;
      min-width: 24px;
      height: 25px;
      background: #f5f6f1;
      color: #7a8474;
      border: 1px solid var(--bd);
      border-bottom-width: 2px;
      border-radius: 5px;
      font: 11px "Segoe UI", sans-serif
    }

    main {
      display: grid;
      grid-template-columns: 262px minmax(0, 1fr);
      align-items: start;
      gap: 26px;
      margin: 26px 0 0
    }

    body:not(.has-data) main {
      display: block
    }

    aside {
      position: sticky;
      top: 20px;
      min-width: 0;
      padding: 22px 19px 18px;
      border: 1px solid var(--bd);
      background: #fdfefb;
      border-radius: 12px;
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #d5ddce transparent
    }

    .side-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 16px;
      margin-bottom: 18px;
      border-bottom: 1px solid var(--bd)
    }

    .side-heading h2 {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      font-size: 13px;
      font-weight: 650
    }

    .side-heading h2 .icon {
      width: 16px;
      height: 16px;
      color: #6a8063
    }

    #reset {
      min-height: 28px;
      padding: 2px 0 2px 8px;
      border: 0;
      background: transparent;
      color: #8b9586;
      font-size: 10px;
      font-weight: 400
    }

    #reset:hover {
      color: var(--ac)
    }

    aside label.t {
      display: flex;
      align-items: center;
      gap: 7px;
      margin: 19px 0 8px;
      color: #66745f;
      font-size: 11px;
      font-weight: 600
    }

    .side-heading+.filter-wide label.t {
      margin-top: 0
    }

    .label-note {
      margin-left: auto;
      font-weight: 400;
      font-size: 9px;
      color: #98a08f
    }

    aside input[type=text],
    aside select {
      width: 100%;
      min-width: 0;
      min-height: 38px;
      padding: 8px 10px;
      border: 1px solid var(--bd);
      border-radius: 7px;
      background: #fff;
      font-size: 11px
    }

    .seg {
      display: flex;
      flex-wrap: wrap;
      gap: 6px
    }

    .seg button {
      min-height: 31px;
      padding: 5px 9px;
      font-size: 10px;
      font-weight: 400;
      border-radius: 6px;
      background: #f7f8f2
    }

    .seg button.on {
      color: #fff;
      background: var(--ac);
      border-color: var(--ac)
    }

    .sups {
      max-height: 200px;
      overflow-y: auto;
      margin-top: 7px;
      padding: 3px 0;
      scrollbar-width: thin;
      scrollbar-color: #d5ddce transparent
    }

    .sups label {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 5px;
      color: #596454;
      font-size: 11px;
      cursor: pointer;
      border-radius: 5px;
      overflow-wrap: anywhere
    }

    .sups label:hover {
      background: var(--acs)
    }

    .sups label input {
      flex: 0 0 auto;
      margin: 0;
      width: 13px;
      height: 13px
    }

    .sups small {
      margin-left: auto;
      color: #89937f;
      font-size: 10px;
      padding: 0 5px;
      background: #f1f4ea;
      border-radius: 4px
    }

    .chk {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 20px;
      padding: 11px;
      border: 1px solid #e6eadc;
      border-radius: 7px;
      background: #f2f5eb;
      color: #687654;
      font-size: 11px;
      cursor: pointer
    }

    .chk input {
      margin: 0;
      width: 13px;
      height: 13px
    }

    .hint {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      margin: 18px 0 0;
      font-size: 10px;
      line-height: 1.9;
      color: #98a08f
    }

    .hint .icon {
      width: 13px;
      height: 13px;
      margin-top: 3px
    }

    .results-section {
      min-width: 0
    }

    .bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
      padding: 2px 0 19px
    }

    .results-title {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .results-title h2 {
      font-size: 17px;
      font-weight: 550;
      margin: 0;
      letter-spacing: .5px
    }

    #count {
      display: block;
      margin-top: 5px;
      color: #899280;
      font-size: 10px;
      font-weight: 400
    }

    .bar .r {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px
    }

    .bar select {
      min-width: 0;
      height: 35px;
      padding: 5px 9px;
      border: 1px solid var(--bd);
      border-radius: 7px;
      font-size: 10px;
      background: #fff
    }

    .bar button {
      min-height: 35px;
      padding: 7px 10px;
      font-size: 10px;
      font-weight: 500
    }

    .bar button .icon {
      width: 14px;
      height: 14px
    }

    #dl {
      color: var(--ac);
      background: #eef4e9;
      border-color: #dae5d1
    }

    .banner {
      position: relative;
      padding: 13px 16px 13px 38px;
      margin-bottom: 18px;
      border: 1px solid #e8e8d7;
      border-radius: 9px;
      background: #f5f5e9;
      font-size: 10px;
      line-height: 1.95;
      color: #8b886a;
      overflow-wrap: anywhere
    }

    .banner::before {
      content: "i";
      position: absolute;
      top: 17px;
      left: 15px;
      display: grid;
      place-items: center;
      width: 13px;
      height: 13px;
      font: 10px Georgia, serif;
      border: 1px solid #b8b38d;
      border-radius: 50%
    }

    .card {
      position: relative;
      min-width: 0;
      margin-bottom: 15px;
      padding: 22px 24px 39px;
      border: 1px solid var(--bd);
      border-radius: 12px;
      background: #fff;
      cursor: pointer;
      transition: border-color .2s, box-shadow .2s;
      overflow-wrap: anywhere
    }

    .card:hover {
      border-color: #acc39d;
      box-shadow: var(--shadow)
    }

    .card::after {
      content: "点击卡片，展开完整内容 ↗";
      position: absolute;
      right: 24px;
      bottom: 13px;
      font-size: 9px;
      letter-spacing: .3px;
      color: #96a08c
    }

    .card.open {
      border-color: #a7be99;
      background: #fefffc;
      padding-bottom: 22px;
      box-shadow: var(--shadow)
    }

    .card.open::after {
      display: none
    }

    .top {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 26px
    }

    .id {
      font: 11px/1.5 Consolas, "Courier New", monospace;
      color: #7c8973;
      letter-spacing: .4px
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border-radius: 5px;
      background: #f2f3ec;
      color: #818671;
      font-size: 9px;
      font-weight: 500
    }

    .pill::before {
      content: "";
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: currentColor
    }

    .pill.Available {
      background: var(--oks);
      color: var(--ok)
    }

    .pill.Taken {
      background: var(--nos);
      color: var(--no)
    }

    .pill.Removed {
      background: #eff0ea;
      color: #8d9385
    }

    .star {
      margin-left: auto;
      min-height: 29px;
      width: 31px;
      padding: 0;
      color: #a1aa97;
      font: 23px/1 Georgia, serif;
      border: 1px solid #edf0e6;
      border-radius: 7px;
      background: #fafbf6
    }

    .star:hover {
      background: #faf5e8;
      border-color: #e9d7a5;
      color: #bc9147
    }

    .star.on {
      color: var(--st);
      background: #fff8e5;
      border-color: #f1e2b9
    }

    .title {
      margin: 11px 0 9px;
      color: #2e443b;
      font-size: 19px;
      font-weight: 600;
      line-height: 1.5;
      letter-spacing: -.2px
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px 18px;
      color: #86907c;
      font-size: 10px
    }

    .meta span {
      display: inline-flex;
      align-items: center;
      gap: 5px
    }

    .meta .icon {
      width: 13px;
      height: 13px;
      color: #93a187
    }

    .desc {
      margin-top: 13px;
      white-space: pre-wrap;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      color: #7e8777;
      font-size: 12px;
      line-height: 1.9
    }

    .card.open .desc {
      display: block;
      -webkit-line-clamp: unset;
      color: #66745f
    }

    .more {
      display: none;
      gap: 20px 26px;
      margin-top: 20px;
      border-top: 1px solid #e9ecdf;
      padding-top: 19px
    }

    .card.open .more {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr))
    }

    .detail-item {
      min-width: 0
    }

    .detail-item:first-child {
      grid-column: 1 / -1
    }

    .more h4 {
      margin: 0 0 7px;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #819376;
      font-weight: 600
    }

    .more p {
      margin: 0;
      font-size: 12px;
      white-space: pre-wrap;
      color: #65725f;
      line-height: 1.9
    }

    .act {
      display: none;
      gap: 8px;
      margin-top: 22px
    }

    .card.open .act {
      display: flex
    }

    .act button {
      min-height: 33px;
      background: #f2f6ec;
      color: #627d51;
      border-color: #e0e8d7;
      font-size: 10px
    }

    mark {
      color: inherit;
      background: var(--hl);
      border-radius: 2px;
      padding: 0 1px
    }

    .seen {
      color: #a1a894;
      font-size: 9px
    }

    .seen.ok {
      color: #7b956d
    }

    .seen.no {
      color: #a58d7c
    }

    .card.rm {
      background: #f9faf6
    }

    .card.rm .title {
      text-decoration: line-through;
      text-decoration-color: #bcc5b2;
      color: #87917e
    }

    #empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 270px;
      padding: 36px 24px;
      text-align: center;
      border: 1px dashed #cbd6bf;
      border-radius: 12px;
      background: #fdfefb;
      transition: border-color .2s, background .2s
    }

    #empty>.icon {
      width: 28px;
      height: 28px;
      color: #819676
    }

    #empty h1 {
      margin: 12px 0 0;
      font-size: 19px;
      font-weight: 600
    }

    #empty p {
      margin: 8px 0 18px;
      color: #7d8973;
      font-size: 13px
    }

    #empty .empty-note {
      margin: 16px 0 0;
      color: #929b89;
      font-size: 11px
    }

    #empty.drag {
      border: 2px dashed #6b935b;
      background: #eef5e6
    }

    .none {
      text-align: center;
      padding: 54px 20px;
      border: 1px dashed #d8e0cc;
      background: #fcfdf9;
      border-radius: 12px;
      color: #89977b;
      font-size: 12px
    }

    #toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      z-index: 20;
      max-width: calc(100vw - 32px);
      transform: translate(-50%, 8px);
      padding: 11px 20px;
      border-radius: 10px;
      background: #315c47;
      color: #fff;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      box-shadow: 0 8px 24px #274f3525;
      transition: opacity .2s, transform .2s;
      text-align: center
    }

    #toast.on {
      opacity: 1;
      transform: translate(-50%, 0)
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto
      }

      *,
      *::before,
      *::after {
        transition: none !important
      }
    }


    .page-shell {
      width: min(1280px, calc(100% - 80px));
      margin: 24px auto 40px
    }

    .search-band .pri {
      flex-shrink: 0;
      white-space: nowrap;
      min-height: 38px
    }

    .file-summary {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 10px 2px 0;
      color: #86927b;
      font-size: 11px;
      min-width: 0
    }

    .file-summary .icon {
      width: 13px;
      height: 13px
    }

    .has-data main {
      margin-top: 16px
    }

    @media (min-width: 1600px) {
      .page-shell {
        width: min(1400px, calc(100% - 120px))
      }
    }

    @media (max-width: 1100px) {
      .page-shell {
        width: calc(100% - 48px)
      }

      main {
        grid-template-columns: 235px minmax(0, 1fr);
        gap: 20px
      }

      .seen {
        flex-basis: 100%;
        order: 3
      }

      .card {
        padding: 19px 20px 36px
      }

      .bar .r {
        width: 100%
      }
    }

    @media (max-width: 800px) {
      main {
        grid-template-columns: 1fr
      }

      aside {
        position: static;
        max-height: none;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0 20px
      }

      .side-heading,
      .filter-wide,
      aside>.hint {
        grid-column: 1/-1
      }

      aside label.t {
        margin-top: 15px
      }

      .sups {
        max-height: 140px
      }

      .bar .r {
        width: auto
      }
    }

    @media (max-width: 540px) {
      .page-shell {
        width: calc(100% - 24px);
        margin-top: 12px
      }

      .search-band {
        min-height: 55px;
        padding: 0 10px;
        gap: 8px
      }

      .search-band>.icon {
        width: 17px;
        height: 17px
      }

      .search-band .pri {
        padding: 7px 10px;
        min-height: 35px;
        font-size: 11px
      }

      .search-band .pri .icon {
        display: none
      }

      #q {
        font-size: 12px
      }

      kbd {
        display: none
      }

      main {
        margin-top: 18px;
        gap: 20px
      }

      #empty {
        padding: 28px 18px;
        min-height: 240px
      }

      aside {
        padding: 18px 16px;
        gap: 0 14px
      }

      .card {
        padding: 17px 17px 37px
      }

      .title {
        font-size: 17px
      }

      .card.open .more {
        grid-template-columns: 1fr
      }

      .detail-item:first-child {
        grid-column: auto
      }

      .bar {
        gap: 13px
      }

      .bar .r {
        width: 100%;
        gap: 6px
      }

      .bar .r select {
        flex: 1
      }

      .bar button {
        padding: 7px 8px;
        font-size: 10px
      }
    }
  </style>
</head>

<body>

  <svg hidden aria-hidden="true" xmlns="http://www.w3.org/2000/svg">

    <symbol id="i-upload" viewBox="0 0 24 24">
      <path d="M12 16V3m-4 4 4-4 4 4M4 15v5h16v-5" />
    </symbol>
    <symbol id="i-search" viewBox="0 0 24 24">
      <circle cx="10.5" cy="10.5" r="6.5" />
      <path d="m16 16 5 5" />
    </symbol>
    <symbol id="i-filter" viewBox="0 0 24 24">
      <path d="M4 6h16M7 12h10m-7 6h4" />
      <circle cx="9" cy="6" r="2" fill="white" />
      <circle cx="15" cy="12" r="2" fill="white" />
    </symbol>
    <symbol id="i-file" viewBox="0 0 24 24">
      <path d="M14 3H5v18h14V8l-5-5Zm0 0v5h5M8 12h8m-8 4h6" />
    </symbol>
    <symbol id="i-copy" viewBox="0 0 24 24">
      <rect x="8" y="8" width="12" height="13" rx="2" />
      <path d="M16 8V3H3v13h5" />
    </symbol>
    <symbol id="i-download" viewBox="0 0 24 24">
      <path d="M12 3v12m-4-4 4 4 4-4M4 16v5h16v-5" />
    </symbol>
    <symbol id="i-shield" viewBox="0 0 24 24">
      <path d="m12 3 8 3v6c0 4-4 7-8 9-4-2-8-5-8-9V6l8-3Z" />
      <path d="m8 12 3 3 5-6" />
    </symbol>
    <symbol id="i-user" viewBox="0 0 24 24">
      <circle cx="12" cy="8" r="4" />
      <path d="M4 21v-3a8 8 0 0 1 16 0v3" />
    </symbol>
    <symbol id="i-tag" viewBox="0 0 24 24">
      <path d="M3 3h8l10 10-8 8L3 11V3Z" />
      <circle cx="7.5" cy="7.5" r="1" />
    </symbol>
    <symbol id="i-leaf" viewBox="0 0 24 24">
      <path d="M20 3c-11-1-17 4-15 11 2 6 14 5 15-11ZM3 21 15 9" />
    </symbol>
  </svg>
  <div class="page-shell">
    <div class="search-band" role="search">
      <svg class="icon" aria-hidden="true">
        <use href="#i-search" />
      </svg>
      <input id="q" type="search" aria-label="搜索项目关键词" placeholder="导入 progress.jsonl 后搜索项目" disabled>
      <kbd aria-hidden="true">/</kbd>
      <button class="pri" type="button" data-import><svg class="icon" aria-hidden="true">
          <use href="#i-upload" />
        </svg>导入数据</button>
      <input id="file" type="file" accept=".jsonl,.json,.txt" hidden aria-label="选择项目数据文件">
    </div>
    <div id="file-summary" class="file-summary" hidden><svg class="icon" aria-hidden="true">
        <use href="#i-file" />
      </svg><span id="file-state"></span></div>
    <main>
      <aside id="side" hidden aria-label="项目筛选">
        <div class="side-heading">
          <h2><svg class="icon" aria-hidden="true">
              <use href="#i-filter" />
            </svg>筛选项目</h2>
          <button id="reset" type="button">重置筛选 ↺</button>
        </div>
        <div class="filter-wide">
          <label class="t">项目状态</label>
          <div class="seg" id="status" aria-label="按项目状态筛选"></div>
        </div>
        <div>
          <label class="t" for="scope">搜索范围</label>
          <select id="scope">
            <option value="all">全部内容</option>
            <option value="title">仅标题</option>
            <option value="td">标题 + 描述</option>
          </select>
        </div>
        <div class="filter-wide">
          <label class="t" for="supq">指导老师<span class="label-note">支持多选</span></label>
          <input type="text" id="supq" placeholder="查找导师姓名…">
          <div class="sups" id="sups"></div>
        </div>
        <div>
          <label class="t" for="type">项目类型</label><select id="type"></select>
        </div>
        <div>
          <label class="t" for="prog">适合专业</label><select id="prog"></select>
        </div>
        <div>
          <label class="t" for="area">研究领域</label>
          <input type="text" id="area" list="arealist" placeholder="如 Computational Intelligence">
          <datalist id="arealist"></datalist>
        </div>
        <div>
          <label class="t" for="skills">所需技能</label>
          <input type="text" id="skills" placeholder="如 Python、Java">
        </div>
        <div class="filter-wide"><label class="chk"><input type="checkbox" id="starred">只看已收藏的项目 <span
              aria-hidden="true" style="margin-left:auto;color:#bd994e">★</span></label></div>
        <p class="hint"><svg class="icon" aria-hidden="true">
            <use href="#i-shield" />
          </svg><span>文件仅在当前页面处理。刷新或重新导入会清空收藏，记得先导出。</span></p>
      </aside>
      <section class="results-section" aria-label="项目列表">
        <div id="empty">
          <svg class="icon" aria-hidden="true">
            <use href="#i-file" />
          </svg>
          <h1>导入项目数据</h1>
          <p>将 progress.jsonl 拖到这里，或选择本地文件。</p>
          <button class="pri" type="button" data-import>选择文件</button>
          <p class="empty-note">数据仅在当前页面读取，不会上传。</p>
        </div>
        <div id="res" hidden>
          <div class="bar">
            <div>
              <div class="results-title">
                <h2>项目列表</h2>
              </div><b id="count" aria-live="polite"></b>
            </div>
            <div class="r">
              <select id="sort" aria-label="项目排序">
                <option value="id">ID 从小到大</option>
                <option value="idd">ID 从大到小</option>
                <option value="title">标题 A–Z</option>
                <option value="sup">导师 A–Z</option>
              </select>
              <button id="exp" type="button" title="复制全部收藏为 Markdown"><svg class="icon" aria-hidden="true">
                  <use href="#i-copy" />
                </svg>复制收藏</button>
              <button id="dl" type="button" title="下载全部收藏为 Markdown"><svg class="icon" aria-hidden="true">
                  <use href="#i-download" />
                </svg>下载收藏</button>
            </div>
          </div>
          <div id="banner"></div>
          <div id="list"></div>
        </div>
      </section>
    </main>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script>
    const $ = s => document.querySelector(s);
    const uiIcon = name => '<svg class="icon" aria-hidden="true"><use href="#i-' + name + '"></use></svg>';
    const ILL = /[\x00-\x08\x0b\x0c\x0e-\x1f]/g;
    const F = [['desc', 'Description'], ['obj', 'Objectives'], ['type', 'Project type'], ['area', 'Specific area of research'], ['skills', 'Skill set required'], ['deliv', 'Expected deliverable'], ['sched', 'Project schedule'], ['inno', 'Innovative component'], ['prog', 'Suitable for programme'], ['by', 'Proposed by'], ['email', 'Email']];
    let all = [], stars = new Set(), sups = new Set(), status = 'Available', terms = [];

    const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    function hl(s) {
      if (!terms.length || !s) return esc(s || '');
      const re = new RegExp('(' + terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
      return s.split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
    }
    function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 1600) }
    const cl = v => typeof v === 'string' ? v.replace(ILL, '').trim() : '';

    function norm(r) {
      const st = cl(r['Status']);
      const o = {
        id: cl(r['Project ID']), title: cl(r['Project Title']), desc: cl(r['Description']), obj: cl(r['Objectives']),
        type: cl(r['Project type']), area: cl(r['Specific area of research']), skills: cl(r['Skill set required']),
        deliv: cl(r['Expected deliverable']), sched: cl(r['Project schedule (List of steps for the project)']),
        inno: cl(r['Innovative component/ project potential']), prog: cl(r['This project suitable for programme']),
        by: cl(r['Proposed by']), seen: cl(r['Last seen']), rmon: cl(r['Removed on']), sup: cl(r['Supervisor name:']), email: cl(r['Email:']),
        status: stat(st)
      };
      o.all = [o.id, o.title, o.desc, o.obj, o.type, o.area, o.skills, o.deliv, o.sched, o.inno, o.prog, o.by, o.sup].join('\n').toLowerCase();
      o.td = (o.title + '\n' + o.desc).toLowerCase();
      o.tl = o.title.toLowerCase();
      return o;
    }

    // 状态只做精确识别：Available / Taken / Removed，其他原样显示，避免把 Unavailable 之类误当成 Available
    function stat(st) {
      const s = st.replace(/[\[\]]/g, '').trim(), l = s.toLowerCase();
      return l === 'available' ? 'Available' : l === 'taken' ? 'Taken' : l === 'removed' ? 'Removed' : (s || '未知');
    }
    let bad = 0, dup = 0, fileTime = null;
    function drawStatus() {
      const c = {}; all.forEach(p => c[p.status] = (c[p.status] || 0) + 1);
      const o = ['Available', 'Taken', 'Removed'], keys = [...o.filter(k => c[k]), ...Object.keys(c).filter(k => !o.includes(k))];
      $('#status').innerHTML = ['<button data-v=""' + (status === '' ? ' class="on"' : '') + '>全部 ' + all.length + '</button>']
        .concat(keys.map(k => '<button data-v="' + esc(k) + '"' + (status === k ? ' class="on"' : '') + '>' + esc(k) + ' ' + c[k] + '</button>')).join('');
    }
    function banner() {
      const rm = all.filter(p => p.status === 'Removed').length,
        oth = all.filter(p => !['Available', 'Taken', 'Removed'].includes(p.status)).length,
        emp = all.filter(p => !p.desc).length,
        sr = all.filter(p => stars.has(p.id) && p.status !== 'Available').length,
        old = fileTime ? Math.floor((Date.now() - fileTime) / 864e5) : null;
      const m = ['数据只是抓取当时的快照，决定申请前，请回 IPMS 网站核对该项目是否仍是 Available。'];
      if (fileTime) m.unshift('数据文件最后修改于 ' + fileTime.toLocaleString() + (old >= 3 ? '（已过 ' + old + ' 天，建议先更新）' : ''));
      if (rm) m.push(rm + ' 个项目已在网站被移除（Removed），默认不显示，可在左侧「状态」里查看。');
      if (sr) m.push('你的收藏里有 ' + sr + ' 个已经不是 Available（已被选走或被移除）。');
      if (oth) m.push(oth + ' 个项目的状态无法识别，请在「状态」筛选里查看。');
      if (emp) m.push(emp + ' 个项目的描述为空，可能是抓取不完整。');
      if (bad) m.push(bad + ' 行数据无法读取，已跳过（可能是中断时写了一半的行）。');
      if (dup) m.push(dup + ' 个重复的 Project ID 已合并，保留文件里最后出现的那条。');
      $('#banner').innerHTML = '<div class="banner">' + m.map(esc).join('<br>') + '</div>';
    }
    function load(text, mod, filename) {
      const m = new Map(); bad = 0; dup = 0;
      text.replace(/^\ufeff/, '').split(/\r?\n/).filter(l => l.trim()).forEach(l => {
        try { const p = norm(JSON.parse(l)); if (!p.id) { bad++; return } if (m.has(p.id)) dup++; m.set(p.id, p) } catch (e) { bad++ }
      });
      all = [...m.values()];
      if (!all.length) { toast('读不到数据，请确认是 progress.jsonl'); return }
      fileTime = mod ? new Date(mod) : null;
      status = all.some(p => p.status === 'Available') ? 'Available' : '';
      stars.clear(); sups.clear(); build();
      $('#empty').hidden = true; $('#res').hidden = false; $('#side').hidden = false; $('#q').disabled = false;
      document.body.classList.add('has-data');
      $('#file-state').textContent = filename || 'progress.jsonl';
      $('#file-summary').hidden = false;
      $('#q').placeholder = '搜索标题、描述或技能（空格分隔多个关键词）';
      render(); toast('已读取 ' + all.length + ' 个项目');
    }

    function opts(sel, arr, label) {
      $(sel).innerHTML = '<option value="">' + label + '</option>' + arr.map(v => '<option>' + esc(v) + '</option>').join('');
    }
    function build() {
      const uniq = f => [...new Set(all.map(f).filter(Boolean))].sort();
      opts('#type', uniq(p => p.type), '全部类型');
      opts('#prog', [...new Set(all.flatMap(p => p.prog.split(/[\n;]+/).map(s => s.trim())).filter(Boolean))].sort(), '全部专业');
      $('#arealist').innerHTML = uniq(p => p.area.replace(/\.$/, '')).map(v => '<option value="' + esc(v) + '">').join('');
      drawSups(); drawStatus();
    }
    function drawSups() {
      const q = $('#supq').value.toLowerCase(), c = {};
      all.forEach(p => { if (p.sup) c[p.sup] = (c[p.sup] || 0) + 1 });
      $('#sups').innerHTML = Object.keys(c).sort().filter(n => n.toLowerCase().includes(q)).map(n =>
        '<label><input type="checkbox" value="' + esc(n) + '"' + (sups.has(n) ? ' checked' : '') + '>' + esc(n) + '<small>' + c[n] + '</small></label>').join('') || '<div class="none" style="padding:10px">没有匹配</div>';
    }

    function filtered() {
      const q = $('#q').value.trim().toLowerCase();
      terms = q ? q.split(/\s+/) : [];
      const key = { all: 'all', title: 'tl', td: 'td' }[$('#scope').value];
      const ty = $('#type').value, pg = $('#prog').value, ar = $('#area').value.trim().toLowerCase(), sk = $('#skills').value.trim().toLowerCase(),
        so = $('#starred').checked;
      let r = all.filter(p =>
        (!status || p.status === status) &&
        (!sups.size || sups.has(p.sup)) &&
        (!ty || p.type === ty) && (!pg || p.prog.includes(pg)) &&
        (!ar || p.area.toLowerCase().includes(ar)) && (!sk || p.skills.toLowerCase().includes(sk)) &&
        (!so || stars.has(p.id)) && terms.every(t => p[key].includes(t)));
      const s = $('#sort').value;
      const cmp = {
        id: (a, b) => a.id.localeCompare(b.id), idd: (a, b) => b.id.localeCompare(a.id),
        title: (a, b) => a.title.localeCompare(b.title), sup: (a, b) => a.sup.localeCompare(b.sup) || a.id.localeCompare(b.id)
      }[s];
      return r.sort(cmp);
    }

    function seenTag(p) {
      if (p.status === 'Removed') return '<span class="seen no">✖ 网站已移除' + (p.rmon ? '（' + esc(p.rmon) + ' 发现）' : '') + '</span>';
      if (p.seen) return '<span class="seen ok">✔ 最近确认仍在：' + esc(p.seen) + '</span>';
      return '<span class="seen">未确认（更新数据后会显示）</span>';
    }
    function card(p) {
      const meta = [p.sup && uiIcon('user') + hl(p.sup), p.type && uiIcon('tag') + hl(p.type), p.area && uiIcon('leaf') + hl(p.area)].filter(Boolean).map(x => '<span>' + x + '</span>').join('');
      const more = F.filter(f => f[0] !== 'desc' && p[f[0]]).map(f => '<div class="detail-item"><h4>' + f[1] + '</h4><p>' + hl(p[f[0]]) + '</p></div>').join('');
      return '<div class="card' + (p.status === 'Removed' ? ' rm' : '') + '" data-id="' + esc(p.id) + '" tabindex="0" aria-expanded="false" aria-label="' + esc(p.title || p.id) + '"><div class="top"><span class="id">' + esc(p.id) + '</span>' +
        '<span class="pill ' + esc(p.status) + '">' + esc(p.status || '?') + '</span>' + seenTag(p) +
        '<button class="star' + (stars.has(p.id) ? ' on' : '') + '" data-a="star" title="收藏" aria-label="收藏项目" aria-pressed="' + stars.has(p.id) + '">' + (stars.has(p.id) ? '★' : '☆') + '</button></div>' +
        '<div class="title">' + hl(p.title) + '</div><div class="meta">' + meta + '</div>' +
        '<div class="desc">' + hl(p.desc) + '</div><div class="more">' + more + '</div>' +
        '<div class="act"><button data-a="copy">复制 ID + 标题 + 描述</button></div></div>';
    }

    function render() {
      const r = filtered();
      $('#count').textContent = '共 ' + r.length + ' 个结果（总数据 ' + all.length + '）' + (stars.size ? ' · 已收藏 ' + stars.size : '');
      $('#list').innerHTML = r.length ? r.map(card).join('') : '<div class="none">没有符合条件的项目，试试放宽筛选</div>';
      banner();
    }

    function md(arr) { return arr.map((p, i) => (i + 1) + '. ' + p.id + ' ' + p.title + '\n' + p.desc + '\n').join('\n') }
    const starred = () => all.filter(p => stars.has(p.id));

    document.querySelectorAll('[data-import]').forEach(button => button.onclick = () => $('#file').click());
    $('#file').onchange = e => { const f = e.target.files[0]; if (f) f.text().then(t => load(t, f.lastModified, f.name)) };
    const emp = $('#empty');
    ['dragover', 'dragenter'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); emp.classList.add('drag') }));
    ['dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); emp.classList.remove('drag') }));
    document.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) f.text().then(t => load(t, f.lastModified, f.name)) });

    ['q', 'scope', 'type', 'prog', 'area', 'skills', 'starred', 'sort'].forEach(id => $('#' + id).addEventListener('input', render));
    $('#status').onclick = e => {
      const b = e.target.closest('button'); if (!b) return; status = b.dataset.v;
      document.querySelectorAll('#status button').forEach(x => x.classList.toggle('on', x === b)); render()
    };
    $('#supq').oninput = drawSups;
    $('#sups').onchange = e => { const c = e.target; c.checked ? sups.add(c.value) : sups.delete(c.value); render() };
    $('#reset').onclick = () => {
      ['q', 'area', 'skills', 'supq'].forEach(id => $('#' + id).value = '');
      ['type', 'prog'].forEach(id => $('#' + id).value = ''); $('#scope').value = 'all'; $('#starred').checked = false;
      sups.clear(); status = all.some(p => p.status === 'Available') ? 'Available' : '';
      drawStatus(); drawSups(); render()
    };

    $('#list').onclick = e => {
      const c = e.target.closest('.card'); if (!c) return;
      const p = all.find(x => x.id === c.dataset.id), action = e.target.closest('[data-a]'), a = action?.dataset.a;
      if (a === 'star') {
        stars.has(p.id) ? stars.delete(p.id) : stars.add(p.id);
        action.classList.toggle('on'); action.textContent = stars.has(p.id) ? '★' : '☆';
        action.setAttribute('aria-pressed', String(stars.has(p.id)));
        banner();
        $('#count').textContent = $('#count').textContent.replace(/ · 已收藏 \d+/, '') + (stars.size ? ' · 已收藏 ' + stars.size : '');
        if ($('#starred').checked) render(); return
      }
      if (a === 'copy') { navigator.clipboard.writeText(p.id + ' ' + p.title + '\n' + p.desc).then(() => toast('已复制')); return }
      if (!getSelection().toString()) {
        c.classList.toggle('open');
        c.setAttribute('aria-expanded', String(c.classList.contains('open')));
      }
    };
    $('#list').addEventListener('keydown', e => {
      if (e.target.classList.contains('card') && (e.key === 'Enter' || e.key === ' ')) {
        e.preventDefault(); e.target.click();
      }
    });
    $('#exp').onclick = () => { const s = starred(); if (!s.length) return toast('还没有收藏'); navigator.clipboard.writeText(md(s)).then(() => toast('已复制 ' + s.length + ' 个' + (s.some(p => p.status !== 'Available') ? '（其中有已不可选的项目）' : ''))) };
    $('#dl').onclick = () => {
      const s = starred(); if (!s.length) return toast('还没有收藏');
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([md(s)], { type: 'text/markdown' }));
      a.download = 'shortlist.md'; a.click(); URL.revokeObjectURL(a.href)
    };
    document.addEventListener('keydown', e => { if (e.key === '/' && !/INPUT|SELECT/.test(document.activeElement.tagName) && !$('#q').disabled) { e.preventDefault(); $('#q').focus() } });
  </script>
</body>

</html>
